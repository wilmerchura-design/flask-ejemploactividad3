<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }} | Flask Ejemplo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>
    <header class="cabecera">
        <h1 class="logo">Flask Ejemplo</h1>
        <nav>
            <a href="{{ url_for('inicio') }}" class="{{ 'activo' if request.endpoint == 'inicio' }}">Inicio</a>
            <a href="{{ url_for('estudiantes') }}" class="{{ 'activo' if request.endpoint == 'estudiantes' }}">Estudiantes</a>
            <a href="{{ url_for('contacto') }}" class="{{ 'activo' if request.endpoint == 'contacto' }}">Contacto</a>
        </nav>
    </header>

    <main class="contenido">
        {% block contenido %}{% endblock %}
    </main>

    <footer class="pie">
        <p>&copy; 2026 Flask Ejemplo &middot; Actividad #3</p>
    </footer>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
